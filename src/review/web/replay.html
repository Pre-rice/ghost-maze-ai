<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鬼迷宫 · 解法回放</title><link rel="icon" href="/game/favicon.svg"><link rel="stylesheet" href="/styles.css"><style>
main{max-width:1250px}.replay-layout{display:grid;grid-template-columns:minmax(550px,1fr) 300px;gap:20px}iframe{width:100%;height:660px;border:0;pointer-events:none;background:#f1f4fa}#steps{max-height:580px;overflow:auto;list-style:none;padding:0}#steps button{width:100%;text-align:left;border:0;border-bottom:1px solid #cdd6e6;background:white;padding:10px;font-size:13px}#steps button[aria-current=true]{background:#dce8fa}#steps .button-step{border-left:4px solid #345da0}#info{white-space:pre-wrap;font-size:13px;line-height:1.6}#controls{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}#controls button{padding:8px 15px}#position{flex:1}#list a{display:block;margin:12px 0}#record-error{color:#a23333}@media(max-width:800px){.replay-layout{display:block}iframe{height:580px}#steps{max-height:240px}}
</style></head><body><main>
<header><strong>解法回放</strong><a href="/game/" target="_blank" rel="noopener">打开游戏</a></header>
<p>每次按按钮独立计为一步。可以逐步查看玩家、鬼和门的变化。</p>
<div id="list"></div><p id="record-error" role="status"></p>
<label>导入导出的录制 JSON<input type="file" id="import" accept=".json,application/json"></label>
<div id="controls" hidden><button id="previous" type="button">上一步</button><button id="next" type="button">下一步</button><input id="position" aria-label="回放步骤" type="range" min="0" value="0"><span id="counter"></span><a id="download" download="ghost-maze-recording.json">下载记录</a></div>
<div class="replay-layout"><iframe id="game" title="只读地图回放" tabindex="-1"></iframe><aside><pre id="info"></pre><ol id="steps"></ol></aside></div>
</main><script type="module" src="/replay.js"></script></body></html>
